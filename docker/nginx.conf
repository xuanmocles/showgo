# ============================================================
# 星幕票务 ShowGo —— 前端 Nginx
#   /                  托管 Vite 构建产物（单页应用）
#   /api/*             反向代理到后端，去掉 /api 前缀
#   /api/seat/stream/* SSE 实时座位图，关闭代理缓冲
#
# 上游用「变量 + Docker 内置 DNS」的写法，nginx 会在运行时重新解析后端地址，
# 因此后端容器重建（docker compose up -d --build backend）后前端不需要跟着重启。
# ============================================================
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Docker 内置 DNS，valid=10s 表示上游地址 10 秒后重新解析
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host backend;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # 单页应用：前端路由交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE 实时座位图：必须关闭代理缓冲，否则座位变更会被攒在缓冲区里推不出去
    location /api/seat/stream/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://$backend_host:8085;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        add_header         X-Accel-Buffering no;
    }

    # 其余接口统一转发，去掉 /api 前缀
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://$backend_host:8085;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
