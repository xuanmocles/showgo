# ============================================================
# 星幕票务 ShowGo —— 一键启动
#   docker compose up -d --build
# 启动顺序：MySQL/Redis/Kafka 健康 -> 建 topic -> 后端 -> 前端
# ============================================================
name: showgo

services:

  # ----------------------------------------------------------
  # MySQL：首次启动自动执行 sql/ 下的脚本，建好 2 个分片库与全部表
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: showgo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    ports:
      # 只映射到本机回环，避免暴露到局域网；默认用 13306 是因为很多人本机已经装了 MySQL 占用 3306
      - "127.0.0.1:${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 按文件名排序执行：1_create_database.sql -> showgo_0.sql -> showgo_1.sql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [showgo-net]

  # ----------------------------------------------------------
  # Redis：座位图、锁座、限流、候补队列
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: showgo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [showgo-net]

  # ----------------------------------------------------------
  # Kafka：KRaft 单节点（无需 Zookeeper）
  #   kafka:9092    容器内使用（后端连接用这个）
  #   localhost:29092  宿主机调试用
  # ----------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: showgo-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "127.0.0.1:${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks: [showgo-net]

  # ----------------------------------------------------------
  # 一次性任务：预建业务 topic（业务前缀 showgo-）
  # ----------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: showgo-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in showgo-ticket_order_topic showgo-seat_change_topic; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic showgo-show_cache_invalidation_topic --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic showgo-show_cache_invalidation_topic.DLQ --partitions 1 --replication-factor 1
        echo "--- topics ---"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"
    networks: [showgo-net]

  # ----------------------------------------------------------
  # 后端：多阶段构建，容器内 Maven 打包
  # ----------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: showgo/backend:latest
    container_name: showgo-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # 容器内通过服务名访问中间件
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BUSINESS_PREFIX: showgo
      # 演示/面试测试用：可在宿主机设置 SEAT_LOCK_SECONDS=30 等临时值验证超时链路
      TICKET_SEAT_LOCK_SECONDS: ${SEAT_LOCK_SECONDS:-900}
      TICKET_ORDER_PAY_TIMEOUT_SECONDS: ${PAY_TIMEOUT_SECONDS:-900}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC -Duser.timezone=Asia/Shanghai"
    ports:
      - "${BACKEND_PORT:-8085}:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks: [showgo-net]

  # ----------------------------------------------------------
  # 前端：Nginx 托管静态资源 + 反向代理 /api（含 SSE 透传）
  # ----------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: showgo/frontend:latest
    container_name: showgo-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      # 用 127.0.0.1 而不是 localhost：容器内 localhost 可能解析到 IPv6，而 nginx 只监听 IPv4
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [showgo-net]

volumes:
  mysql-data:
  redis-data:
  kafka-data:

networks:
  showgo-net:
    driver: bridge
